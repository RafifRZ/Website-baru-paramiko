<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParaMaster</title>
    <meta name="description" content="Sign in to ParaMaster network automation dashboard.">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        // Immediately apply theme before HTML renders to prevent theme flash
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.remove('light');
            }
        })();
    </script>
    <style>
        :root {
            --bg-login: #181824; /* Greyish Dark */
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-label: #5d667c;
            --bg-input: rgba(255, 255, 255, 0.04);
            --border-input: rgba(255, 255, 255, 0.08);
            --shadow-card: rgba(0, 0, 0, 0.3);
            --grid-color: rgba(255, 255, 255, 0.015);
        }

        .light {
            --bg-login: #f8fafc;
            --bg-card: #ffffff;
            --border-color: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-label: #64748b;
            --bg-input: #ffffff;
            --border-input: rgba(0, 0, 0, 0.08);
            --shadow-card: rgba(0, 0, 0, 0.04);
            --grid-color: rgba(0, 0, 0, 0.015);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-login);
            color: var(--text-primary);
            overflow: hidden;
            transition: background 0.25s, color 0.25s;
        }

        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Static orbs (no GPU-heavy animation) */
        .login-bg::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
        }

        .login-bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 70%);
        }

        .glass-login {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 25px 80px var(--shadow-card);
            transition: background-color 0.25s, border-color 0.25s;
        }

        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: rgba(139,92,246,0.5);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.08);
            background: var(--bg-input);
        }
        
        .light .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field::placeholder {
            color: #43485f;
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 8px 30px rgba(99,102,241,0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgba(99,102,241,0.35);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card { animation: cardIn 0.4s ease-out; }

        /* Grid pattern */
        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen relative">
    <div class="login-bg"></div>
    <div class="grid-pattern"></div>

    <!-- Theme Switcher floating top-right -->
    <div class="absolute top-6 right-6 z-20">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors" title="Toggle Theme" id="theme-toggle-btn">
            <i class="fas fa-sun" id="theme-toggle-icon"></i>
        </button>
    </div>

    <div class="w-full max-w-md px-6 relative z-10 animate-card">
        <!-- Branding -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-xl rotate-[-4deg]">
                <i class="fas fa-layer-group"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight">ParaMaster</h1>
            <p class="text-[10px] text-purple-400 font-bold uppercase tracking-[0.25em] mt-1.5">Network Automation Platform</p>
        </div>

        <!-- Login Card -->
        <div class="glass-login rounded-3xl p-9">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-6 px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-3
                {% if category == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20
                {% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
                <i class="fas {% if category == 'error' %}fa-triangle-exclamation{% else %}fa-check-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6" id="login-form">
                <div>
                    <label class="block text-[10px] font-extrabold text-[var(--text-label)] uppercase tracking-[0.2em] mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="text" name="username" id="login-username"
                            class="input-field w-full pl-11 pr-5 py-4 rounded-xl font-semibold text-sm outline-none"
                            placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-[var(--text-label)] uppercase tracking-[0.2em] mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="password" name="password" id="login-password"
                            class="input-field w-full pl-11 pr-5 py-4 rounded-xl font-semibold text-sm outline-none"
                            placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" id="login-submit"
                    class="btn-login w-full text-white font-extrabold py-4 rounded-xl flex items-center justify-center gap-3 text-xs uppercase tracking-wider">
                    Sign In
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-slate-500 mt-8 text-[9px] font-bold uppercase tracking-widest">
            &copy; 2026 ParaMaster &bull; v0.8.9-Beta
        </p>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-toggle-icon');
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                localStorage.setItem('theme', 'dark');
                if (icon) icon.className = 'fas fa-sun';
            } else {
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
                if (icon) icon.className = 'fas fa-moon';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const icon = document.getElementById('theme-toggle-icon');
            if (icon) {
                if (document.documentElement.classList.contains('light')) {
                    icon.className = 'fas fa-moon';
                } else {
                    icon.className = 'fas fa-sun';
                }
            }
        });
    </script>
</body>

</html>
